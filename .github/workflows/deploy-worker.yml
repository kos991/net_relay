name: deploy-worker

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Cloudflare Worker name"
        required: false
        default: "rels-worker"
      route:
        description: "Cloudflare Worker route; empty or none deploys without binding a route"
        required: false
        default: ""
      zone_name:
        description: "Optional Cloudflare DNS zone name used to create the Worker hostname record"
        required: false
        default: "jinfei.org"
      zone_id:
        description: "Optional Cloudflare Zone ID; preferred when the API token cannot list zones"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        env:
          WORKER_NAME: ${{ github.event.inputs.worker_name }}
          ROUTE: ${{ github.event.inputs.route }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --global wrangler
          deploy_command=(deploy worker/rels-worker.js --name "${WORKER_NAME}" --compatibility-date 2026-06-08)
          case "${ROUTE}" in
            none|NONE|-)
              ROUTE=""
              ;;
          esac
          if [ -n "${ROUTE}" ]; then
            deploy_command+=(--route "${ROUTE}")
          fi
          wrangler "${deploy_command[@]}"

      - name: Configure Worker R2 release base
        env:
          R2_RELEASE_BASE: ${{ vars.R2_RELEASE_BASE || secrets.R2_RELEASE_BASE }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${R2_RELEASE_BASE}" ] || [ -z "${CLOUDFLARE_R2_ACCESS_KEY_ID}" ] || [ -z "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}" ] || [ -z "${CLOUDFLARE_R2_BUCKET}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "R2 Worker secrets are not fully configured; Worker will proxy GitHub Release assets."
            exit 0
          fi
          npm install --global wrangler
          printf '%s' "${R2_RELEASE_BASE%/}" | wrangler secret put R2_RELEASE_BASE --name "${{ github.event.inputs.worker_name }}"
          printf '%s' "${CLOUDFLARE_R2_ACCESS_KEY_ID}" | wrangler secret put R2_ACCESS_KEY_ID --name "${{ github.event.inputs.worker_name }}"
          printf '%s' "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}" | wrangler secret put R2_SECRET_ACCESS_KEY --name "${{ github.event.inputs.worker_name }}"
          printf '%s' "${CLOUDFLARE_R2_BUCKET}" | wrangler secret put R2_BUCKET --name "${{ github.event.inputs.worker_name }}"
          printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | wrangler secret put R2_ACCOUNT_ID --name "${{ github.event.inputs.worker_name }}"

      - name: Ensure Worker DNS record
        env:
          ROUTE: ${{ github.event.inputs.route }}
          ZONE_NAME: ${{ github.event.inputs.zone_name }}
          ZONE_ID: ${{ github.event.inputs.zone_id || vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          case "${ROUTE}" in
            ""|none|NONE|-)
              echo "No route configured; skipping DNS record."
              exit 0
              ;;
          esac

          hostname="${ROUTE%%/*}"
          if [ -z "${hostname}" ] || [ -z "${ZONE_NAME}" ]; then
            echo "No hostname or zone name configured; skipping DNS record."
            exit 0
          fi

          zone_id="${ZONE_ID:-}"
          if [ -z "${zone_id}" ]; then
            zone_id="$(curl -fsSL \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); result=data.get("result") or []; print(result[0]["id"] if result else "")')"
          fi
          if [ -z "${zone_id}" ]; then
            echo "::error::Cloudflare zone not found or token cannot read zones: ${ZONE_NAME}. Set CLOUDFLARE_ZONE_ID to avoid the zone-list API."
            exit 1
          fi

          record_id="$(curl -fsSL \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=CNAME&name=${hostname}" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); result=data.get("result") or []; print(result[0]["id"] if result else "")')"
          payload="$(python3 - <<PY
          import json
          print(json.dumps({
              "type": "CNAME",
              "name": "${hostname}",
              "content": "workers.dev",
              "ttl": 1,
              "proxied": True,
          }))
          PY
          )"

          if [ -n "${record_id}" ]; then
            method="PUT"
            url="https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}"
          else
            method="POST"
            url="https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records"
          fi

          curl -fsSL -X "${method}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}" \
            "${url}" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("success"), data; print("DNS record ready")'
