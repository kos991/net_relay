name: deploy-worker

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Cloudflare Worker name"
        required: false
        default: "rels-worker"
      route:
        description: "Cloudflare Worker route; empty or none deploys without binding a route"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        env:
          WORKER_NAME: ${{ github.event.inputs.worker_name }}
          ROUTE: ${{ github.event.inputs.route }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          npm install --global wrangler
          cat > worker/wrangler.jsonc <<EOF
          {
            "name": "${WORKER_NAME}",
            "main": "rels-worker.js",
            "compatibility_date": "2026-06-08",
            "r2_buckets": [
              {
                "binding": "RELEASE_BUCKET",
                "bucket_name": "${CLOUDFLARE_R2_BUCKET}"
              }
            ]
          }
          EOF

          deploy_command=(deploy --config worker/wrangler.jsonc)
          case "${ROUTE}" in
            none|NONE|-)
              ROUTE=""
              ;;
          esac
          if [ -n "${ROUTE}" ]; then
            deploy_command+=(--route "${ROUTE}")
          fi
          wrangler "${deploy_command[@]}"

      - name: Configure Worker R2 release base
        env:
          R2_RELEASE_BASE: ${{ vars.R2_RELEASE_BASE || secrets.R2_RELEASE_BASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${R2_RELEASE_BASE}" ]; then
            echo "R2_RELEASE_BASE is not configured; Worker will proxy GitHub Release assets."
            exit 0
          fi
          npm install --global wrangler
          printf '%s' "${R2_RELEASE_BASE%/}" | wrangler secret put R2_RELEASE_BASE --name "${{ github.event.inputs.worker_name }}"
