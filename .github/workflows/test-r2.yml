name: test-r2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || '' }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || '' }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || secrets.CLOUDFLARE_R2_BUCKET || '' }}
    steps:
      - name: Verify R2 S3 credentials
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_R2_ACCESS_KEY_ID}" ] || [ -z "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}" ] || [ -z "${CLOUDFLARE_R2_BUCKET}" ]; then
            echo "::error::Cloudflare R2 credentials are not fully configured."
            exit 1
          fi

          python3 -m pip install --user --upgrade awscli
          export PATH="${HOME}/.local/bin:${PATH}"
          export AWS_ACCESS_KEY_ID="${CLOUDFLARE_R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="auto"

          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          object_key="_permission-test/github-actions-${GITHUB_RUN_ID}.txt"
          printf 'net-relay r2 permission test: %s\n' "${GITHUB_RUN_ID}" > r2-permission-test.txt

          aws --endpoint-url "${endpoint}" s3 cp r2-permission-test.txt "s3://${CLOUDFLARE_R2_BUCKET}/${object_key}"
          aws --endpoint-url "${endpoint}" s3 cp "s3://${CLOUDFLARE_R2_BUCKET}/${object_key}" r2-permission-test.downloaded.txt
          cmp r2-permission-test.txt r2-permission-test.downloaded.txt
          aws --endpoint-url "${endpoint}" s3 rm "s3://${CLOUDFLARE_R2_BUCKET}/${object_key}"
