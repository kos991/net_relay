name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell syntax
        run: |
          bash -n i.sh
          bash -n install.sh
          bash -n setup-relay.sh
          bash -n sync/sync-relay-certs.sh
          bash -n tests/test-generate.sh

      - name: Run shellcheck
        run: shellcheck i.sh install.sh setup-relay.sh sync/sync-relay-certs.sh tests/test-generate.sh

      - name: Test generated files
        run: bash tests/test-generate.sh
