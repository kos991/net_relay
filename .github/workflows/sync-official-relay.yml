name: sync-official-relay

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect latest official NetBird release tag
        id: upstream
        run: |
          latest_tag="$(
            git ls-remote https://github.com/netbirdio/netbird.git "refs/tags/v*" \
              | awk '{print $2}' \
              | sed 's#refs/tags/##; s#\\^{}##' \
              | grep -E '^v[0-9]+\\.[0-9]+\\.[0-9]+$' \
              | sort -V \
              | tail -1
          )"
          if [ -z "$latest_tag" ]; then
            echo "::error::Unable to detect latest official NetBird release tag"
            exit 1
          fi

          mkdir -p .github
          current_tag=""
          if [ -f .github/netbird-relay-upstream.sha ]; then
            current_tag="$(cat .github/netbird-relay-upstream.sha)"
          fi

          {
            echo "latest_tag=${latest_tag}"
            echo "current_tag=${current_tag}"
          } >> "$GITHUB_OUTPUT"

          if [ "$latest_tag" = "$current_tag" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$latest_tag" > .github/netbird-relay-upstream.sha
          fi

      - name: Save upstream tag marker
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/netbird-relay-upstream.sha
          git commit -m "Track NetBird relay ${{ steps.upstream.outputs.latest_tag }}"
          git push origin HEAD:main

      - name: Trigger OVA release build
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-ova \
            --ref main \
            -f netbird_relay_ref="${{ steps.upstream.outputs.latest_tag }}"
