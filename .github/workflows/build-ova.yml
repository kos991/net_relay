name: build-ova

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, empty means next v1.0.N"
        required: false
        default: ""
      relay_image:
        description: "Relay image to use in OVA"
        required: false
        default: "crpi-9kn2o1el6okkk1mu.cn-shanghai.personal.cr.aliyuncs.com/netrels/netrels:relay"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALPINE_IMAGE_URL: https://dev.alpinelinux.org/~tomalok/alpine-cloud-images/v3.23/nocloud/x86_64/nocloud_alpine-3.23.4-x86_64-bios-cloudinit-r0.qcow2
      OVA_NAME: net-relay-alpine-x86_64.ova
      QCOW2_NAME: net-relay-alpine-x86_64.qcow2.gz
      INSTALLER_ARCHIVE_NAME: net_relay-main.tar.gz
      SYSTEM_DISK_GB: 3
      DEFAULT_IMAGE_REPOSITORY: crpi-9kn2o1el6okkk1mu.cn-shanghai.personal.cr.aliyuncs.com/netrels/netrels
      RELAY_IMAGE: ${{ github.event.inputs.relay_image || 'crpi-9kn2o1el6okkk1mu.cn-shanghai.personal.cr.aliyuncs.com/netrels/netrels:relay' }}
      CADDY_IMAGE: crpi-9kn2o1el6okkk1mu.cn-shanghai.personal.cr.aliyuncs.com/netrels/netrels:caddy
      SYNC_IMAGE: crpi-9kn2o1el6okkk1mu.cn-shanghai.personal.cr.aliyuncs.com/netrels/netrels:sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils libguestfs-tools

      - name: Generate release metadata
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [ -n "${RELEASE_TAG_INPUT}" ]; then
            release_tag="${RELEASE_TAG_INPUT}"
          else
            git fetch --tags --force
            latest_patch="$(git tag -l 'v1.0.*' | sed -n 's/^v1\.0\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
            if [ -z "${latest_patch}" ]; then
              release_tag="v1.0.0"
            else
              release_tag="v1.0.$((latest_patch + 1))"
            fi
          fi

          case "${release_tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tag must use semantic format, for example v1.0.0"; exit 1 ;;
          esac

          root_password="Net@rels2026"
          ssh_port="$(python3 -c "import secrets; print(secrets.randbelow(45536) + 20000)")"

          {
            echo "release_tag=${release_tag}"
            echo "root_password=${root_password}"
            echo "ssh_port=${ssh_port}"
            echo "update_note=$(git log -1 --pretty=%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch Alpine packages for offline install
        run: |
          mkdir -p ova-build/apks
          docker run --rm -v "$PWD/ova-build/apks:/out" alpine:3.23 sh -c '
            set -e
            sed -i "/community/s/^#//" /etc/apk/repositories
            apk update
            apk fetch --recursive --output /out \
              bash wget curl git vim nano unzip zip rsync \
              docker docker-openrc docker-cli-compose \
              ca-certificates openssl openssh \
              cloud-init cloud-init-openrc cloud-init-datasource-aliyun \
              qemu-guest-agent \
              net-tools iproute2 iputils iputils-tracepath \
              bind-tools busybox-extras lsof || {
              echo "Failed to fetch required packages."
              apk search cloud-init
              apk search qemu-guest-agent
              exit 1
            }
            ls -lh /out | head -20
          '

      - name: Prepare installer payload
        run: |
          mkdir -p ova-build/netbird-relay-installer
          cp -a caddy sync setup-relay.sh install.sh main.sh README.md .gitignore .gitattributes ova-build/netbird-relay-installer/

      - name: Download Alpine cloud image
        run: |
          curl -fsSL "$ALPINE_IMAGE_URL" -o ova-build/alpine.qcow2
          qemu-img resize ova-build/alpine.qcow2 "${SYSTEM_DISK_GB}G"
          sudo guestfish --rw -a ova-build/alpine.qcow2 <<'EOF'
          run
          resize2fs /dev/sda
          EOF

      - name: Customize Alpine image
        env:
          LIBGUESTFS_BACKEND: direct
          ROOT_PASSWORD: ${{ steps.meta.outputs.root_password }}
          SSH_PORT: ${{ steps.meta.outputs.ssh_port }}
        run: |
          set +e
          sudo -E virt-customize --no-network --format qcow2 -a ova-build/alpine.qcow2 \
            --root-password "password:${ROOT_PASSWORD}" \
            --run-command "sed -i '/community/s/^#//' /etc/apk/repositories" \
            --copy-in ova-build/apks:/tmp \
            --run-command "apk add --allow-untrusted /tmp/apks/*.apk" \
            --run-command "rm -rf /tmp/apks /var/cache/apk/*" \
            --run-command "mkdir -p /etc/cloud/cloud.cfg.d && printf '%s\n' 'datasource_list: [ AliYun, Ec2, NoCloud, None ]' > /etc/cloud/cloud.cfg.d/99_net_relay_datasource.cfg" \
            --copy-in ova/files/99-net-relay-login.cfg:/etc/cloud/cloud.cfg.d \
            --run-command "if [ -f /etc/init.d/cloud-init-local ]; then rc-update add cloud-init-local boot; fi" \
            --run-command "if [ -f /etc/init.d/cloud-init ]; then rc-update add cloud-init default; fi" \
            --run-command "if [ -f /etc/init.d/cloud-config ]; then rc-update add cloud-config default; fi" \
            --run-command "if [ -f /etc/init.d/cloud-final ]; then rc-update add cloud-final default; fi" \
            --run-command "if [ -f /etc/init.d/sysctl ]; then rc-update add sysctl boot; fi" \
            --run-command "rc-update add docker default" \
            --run-command "if [ -f /etc/init.d/qemu-guest-agent ]; then rc-update add qemu-guest-agent default; fi" \
            --run-command "rc-update add sshd default" \
            --mkdir /usr/local/sbin \
            --mkdir /etc/sysctl.d \
            --copy-in ova-build/netbird-relay-installer:/opt \
            --copy-in ova/files/rels:/usr/local/sbin \
            --copy-in ova/files/net-relay-firstboot:/usr/local/sbin \
            --copy-in ova/files/net-relay-hw-check:/usr/local/sbin \
            --copy-in ova/files/sshd_config:/etc/ssh \
            --copy-in ova/files/99-net-relay-sysctl.conf:/etc/sysctl.d \
            --copy-in ova/files/root-profile:/root \
            --run-command "sed -i 's/__SSH_PORT__/${SSH_PORT}/' /etc/ssh/sshd_config" \
            --run-command "sed -i 's#__RELAY_IMAGE__#${RELAY_IMAGE}#' /usr/local/sbin/net-relay-firstboot" \
            --run-command "sed -i 's#__CADDY_IMAGE__#${CADDY_IMAGE}#' /usr/local/sbin/net-relay-firstboot" \
            --run-command "sed -i 's#__SYNC_IMAGE__#${SYNC_IMAGE}#' /usr/local/sbin/net-relay-firstboot" \
            --run-command "passwd -u root || true" \
            --run-command "ssh-keygen -A" \
            --run-command "sshd -t" \
            --run-command "printf 'sshd effective config: '; grep -E '^(Port|PermitRootLogin|PasswordAuthentication|PubkeyAuthentication) ' /etc/ssh/sshd_config" \
            --run-command "chmod +x /usr/local/sbin/rels /usr/local/sbin/net-relay-firstboot /usr/local/sbin/net-relay-hw-check /opt/netbird-relay-installer/setup-relay.sh" \
            --run-command "cat /root/root-profile >> /root/.profile && rm -f /root/root-profile" 2>&1 | tee ova-build/virt-customize.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            {
              echo "virt-customize failed with exit code ${status}"
              tail -n 80 ova-build/virt-customize.log
            } | python3 -c 'import sys; print("::error::" + sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit "$status"
          fi

      - name: Package release images
        run: |
          mkdir -p release
          qemu-img convert -p -O vmdk -o subformat=streamOptimized,adapter_type=lsilogic ova-build/alpine.qcow2 release/net-relay-alpine-x86_64.vmdk
          vmdk_size="$(stat -c%s release/net-relay-alpine-x86_64.vmdk)"

          cat > release/net-relay-alpine-x86_64.ovf <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Envelope xmlns="http://schemas.dmtf.org/ovf/envelope/1" xmlns:ovf="http://schemas.dmtf.org/ovf/envelope/1" xmlns:rasd="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/CIM_ResourceAllocationSettingData" xmlns:vmw="http://www.vmware.com/schema/ovf">
            <References>
              <File ovf:id="file1" ovf:href="net-relay-alpine-x86_64.vmdk" ovf:size="${vmdk_size}"/>
            </References>
            <DiskSection>
              <Info>Virtual disk information</Info>
              <Disk ovf:diskId="disk1" ovf:fileRef="file1" ovf:capacity="${SYSTEM_DISK_GB}" ovf:capacityAllocationUnits="byte * 2^30" ovf:format="http://www.vmware.com/interfaces/specifications/vmdk.html#streamOptimized"/>
            </DiskSection>
            <NetworkSection>
              <Info>Logical networks used in the package</Info>
              <Network ovf:name="VM Network">
                <Description>The VM Network network</Description>
              </Network>
            </NetworkSection>
            <VirtualSystem ovf:id="net-relay-alpine">
              <Info>NetBird Relay Alpine OVA</Info>
              <Name>net-relay-alpine</Name>
              <OperatingSystemSection ovf:id="94" vmw:osType="otherlinux64Guest">
                <Info>Alpine Linux</Info>
              </OperatingSystemSection>
              <VirtualHardwareSection>
                <Info>Virtual hardware requirements</Info>
                <System>
                  <vssd:ElementName xmlns:vssd="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/CIM_VirtualSystemSettingData">Virtual Hardware Family</vssd:ElementName>
                  <vssd:InstanceID xmlns:vssd="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/CIM_VirtualSystemSettingData">0</vssd:InstanceID>
                  <vssd:VirtualSystemIdentifier xmlns:vssd="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/CIM_VirtualSystemSettingData">net-relay-alpine</vssd:VirtualSystemIdentifier>
                  <vssd:VirtualSystemType xmlns:vssd="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/CIM_VirtualSystemSettingData">vmx-14</vssd:VirtualSystemType>
                </System>
                <Item>
                  <rasd:Description>1 virtual CPU</rasd:Description>
                  <rasd:ElementName>1 virtual CPU</rasd:ElementName>
                  <rasd:InstanceID>1</rasd:InstanceID>
                  <rasd:ResourceType>3</rasd:ResourceType>
                  <rasd:VirtualQuantity>1</rasd:VirtualQuantity>
                </Item>
                <Item>
                  <rasd:AllocationUnits>byte * 2^20</rasd:AllocationUnits>
                  <rasd:Description>1024MB memory</rasd:Description>
                  <rasd:ElementName>1024MB memory</rasd:ElementName>
                  <rasd:InstanceID>2</rasd:InstanceID>
                  <rasd:ResourceType>4</rasd:ResourceType>
                  <rasd:VirtualQuantity>1024</rasd:VirtualQuantity>
                </Item>
                <Item>
                  <rasd:Description>SCSI Controller</rasd:Description>
                  <rasd:ElementName>SCSI Controller 0</rasd:ElementName>
                  <rasd:InstanceID>3</rasd:InstanceID>
                  <rasd:ResourceSubType>lsilogic</rasd:ResourceSubType>
                  <rasd:ResourceType>6</rasd:ResourceType>
                </Item>
                <Item>
                  <rasd:Address>00:50:56:00:00:01</rasd:Address>
                  <rasd:AddressOnParent>0</rasd:AddressOnParent>
                  <rasd:AutomaticAllocation>true</rasd:AutomaticAllocation>
                  <rasd:Connection>VM Network</rasd:Connection>
                  <rasd:Description>Network Adapter</rasd:Description>
                  <rasd:ElementName>Network Adapter 1</rasd:ElementName>
                  <rasd:InstanceID>4</rasd:InstanceID>
                  <rasd:ResourceSubType>E1000</rasd:ResourceSubType>
                  <rasd:ResourceType>10</rasd:ResourceType>
                </Item>
                <Item>
                  <rasd:Description>Disk</rasd:Description>
                  <rasd:ElementName>Disk 1</rasd:ElementName>
                  <rasd:HostResource>ovf:/disk/disk1</rasd:HostResource>
                  <rasd:InstanceID>5</rasd:InstanceID>
                  <rasd:Parent>3</rasd:Parent>
                  <rasd:ResourceType>17</rasd:ResourceType>
                </Item>
                <vmw:Config ovf:required="false" vmw:key="automaticMACAddressAllocation" vmw:value="true"/>
              </VirtualHardwareSection>
            </VirtualSystem>
          </Envelope>
          EOF

          tar -C release -cf "release/${OVA_NAME}" net-relay-alpine-x86_64.ovf net-relay-alpine-x86_64.vmdk
          qemu-img convert -p -O qcow2 -c ova-build/alpine.qcow2 release/net-relay-alpine-x86_64.qcow2
          gzip -9 release/net-relay-alpine-x86_64.qcow2
          git archive --format=tar.gz --prefix=net_relay-main/ HEAD -o "release/${INSTALLER_ARCHIVE_NAME}"
          cp install.sh release/install.sh

          (cd release && sha256sum "$OVA_NAME" "$QCOW2_NAME" "$INSTALLER_ARCHIVE_NAME" install.sh > SHA256SUMS)

      - name: Write release notes
        run: |
          cat > release/RELEASE_NOTES.md <<EOF
          # NetBird Relay OVA

          登录信息：
          - 用户名：root
          - 密码：${{ steps.meta.outputs.root_password }}
          - SSH 端口：${{ steps.meta.outputs.ssh_port }}

          下载文件：
          - \`${OVA_NAME}\`：VMware / ESXi
          - \`${QCOW2_NAME}\`：KVM / Proxmox / 阿里云
          - \`${INSTALLER_ARCHIVE_NAME}\`：一键脚本离线安装包
          - \`install.sh\`：一键安装入口
          - \`SHA256SUMS\`：校验文件

          运行说明：
          - OVA 首次登录会先自检 Docker、Docker Compose、磁盘空间和 ACR 镜像拉取。
          - 运行镜像默认从阿里云 ACR 公网拉取：\`${RELAY_IMAGE}\`、\`${CADDY_IMAGE}\`、\`${SYNC_IMAGE}\`。
          - 一键脚本命令：\`bash <(curl -sSL https://rels.jinfei.org)\`

          本次更新：
          - ${{ steps.meta.outputs.update_note }}
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.release_tag }}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release/RELEASE_NOTES.md \
            "release/${OVA_NAME}" \
            "release/${QCOW2_NAME}" \
            "release/${INSTALLER_ARCHIVE_NAME}" \
            "release/install.sh" \
            release/SHA256SUMS
