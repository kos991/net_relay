name: build-ova

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, empty means next v1.0.N"
        required: false
        default: ""
      netbird_relay_ref:
        description: "NetBird upstream ref/tag/branch to build relay from"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INSTALLER_ARCHIVE_NAME: net_relay-main.tar.gz
      RELAY_AMD64_PACKAGE: netbird-relay-linux-amd64.tar.gz
      RELAY_ARM64_PACKAGE: netbird-relay-linux-arm64.tar.gz
      NETBIRD_RELAY_REF: ${{ github.event.inputs.netbird_relay_ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check OVA scripts
        run: bash tests/ova-scripts-check.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tar gzip

      - name: Build official NetBird relay binaries
        run: |
          mkdir -p dist release
          TARGET_OS=linux TARGET_ARCH=amd64 NETBIRD_RELAY_REF="${NETBIRD_RELAY_REF}" bash relay/build-relay.sh
          TARGET_OS=linux TARGET_ARCH=arm64 NETBIRD_RELAY_REF="${NETBIRD_RELAY_REF}" bash relay/build-relay.sh
          TARGET_OS=linux TARGET_ARCH=amd64 NETBIRD_RELAY_REF="${NETBIRD_RELAY_REF}" bash relay/package-relay.sh
          TARGET_OS=linux TARGET_ARCH=arm64 NETBIRD_RELAY_REF="${NETBIRD_RELAY_REF}" bash relay/package-relay.sh

      - name: Generate release metadata
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [ -n "${RELEASE_TAG_INPUT}" ]; then
            release_tag="${RELEASE_TAG_INPUT}"
          else
            git fetch --tags --force
            latest_patch="$(git tag -l 'v1.0.*' | sed -n 's/^v1\.0\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
            if [ -z "${latest_patch}" ]; then
              release_tag="v1.0.0"
            else
              release_tag="v1.0.$((latest_patch + 1))"
            fi
          fi

          case "${release_tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tag must use semantic format, for example v1.0.0"; exit 1 ;;
          esac

          root_password="Net@rels2026"
          ssh_port="$(python3 -c "import secrets; print(secrets.randbelow(45536) + 20000)")"

          {
            echo "release_tag=${release_tag}"
            echo "root_password=${root_password}"
            echo "ssh_port=${ssh_port}"
            echo "update_note=$(git log -1 --pretty=%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare installer payload
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix=net_relay-main/ HEAD -o "release/${INSTALLER_ARCHIVE_NAME}"
          cp install.sh release/install.sh

          (cd release && sha256sum "$INSTALLER_ARCHIVE_NAME" "$RELAY_AMD64_PACKAGE" "$RELAY_ARM64_PACKAGE" install.sh > SHA256SUMS)

      - name: Write release notes
        run: |
          cat > release/RELEASE_NOTES.md <<EOF
          # NetBird Relay ${{ steps.meta.outputs.release_tag }}

          \`\`\`bash
          curl -sSL https://rels.jinfei.org | sh
          \`\`\`

          NetBird Relay upstream ref:
          - ${NETBIRD_RELAY_REF}

          本次更新：
          - ${{ steps.meta.outputs.update_note }}
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.release_tag }}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release/RELEASE_NOTES.md \
            "release/${INSTALLER_ARCHIVE_NAME}" \
            "release/${RELAY_AMD64_PACKAGE}" \
            "release/${RELAY_ARM64_PACKAGE}" \
            "release/install.sh" \
            release/SHA256SUMS
