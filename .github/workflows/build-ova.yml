name: build-ova

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, empty means next tag for selected channel"
        required: false
        default: ""
      release_channel:
        description: "Release channel: stable uses v1.0.N, test uses v0.1.N"
        required: false
        default: "stable"
      netbird_relay_ref:
        description: "NetBird upstream ref/tag/branch to build relay from"
        required: false
        default: "main"
      publish_release:
        description: "Publish GitHub Release after build"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALPINE_IMAGE_URL: https://dev.alpinelinux.org/~tomalok/alpine-cloud-images/v3.23/nocloud/x86_64/nocloud_alpine-3.23.4-x86_64-bios-cloudinit-r0.qcow2
      OVA_NAME: net-relay-alpine-x86_64.ova
      RAW_NAME: net-relay-alpine-x86_64.raw
      QCOW2_NAME: net-relay-alpine-x86_64.qcow2
      IMAGE_SIZE_MIB: "640"
      MIN_ROOT_FREE_MIB: "256"
      RELAY_AMD64_PACKAGE: netbird-relay-linux-amd64.tar.gz
      RELAY_ARM64_PACKAGE: netbird-relay-linux-arm64.tar.gz
      NETBIRD_RELAY_REF: ${{ github.event.inputs.netbird_relay_ref || 'main' }}
      OVA_APK_PACKAGES: bash ca-certificates curl sudo wget openssl openssh-server cloud-init cloud-init-openrc qemu-guest-agent qemu-guest-agent-openrc procps-ng util-linux iproute2 cloud-utils-growpart e2fsprogs-extra xfsprogs btrfs-progs zram-init cronie parted tzdata gnutls syslinux
      TRIVY_VERSION: "0.71.0"
      TRIVY_CHECKSUM: "30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814"
      R2_RELEASE_BASE: ${{ vars.R2_RELEASE_BASE || secrets.R2_RELEASE_BASE || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || '' }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || '' }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || secrets.CLOUDFLARE_R2_BUCKET || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Cloudflare R2 S3 credentials
        run: |
          if [ -z "${R2_RELEASE_BASE}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_R2_ACCESS_KEY_ID}" ] || [ -z "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}" ] || [ -z "${CLOUDFLARE_R2_BUCKET}" ]; then
            echo "Cloudflare R2 is not fully configured; skipping R2 credential verification."
            exit 0
          fi

          python3 -m pip install --user --upgrade awscli
          export PATH="${HOME}/.local/bin:${PATH}"
          export AWS_ACCESS_KEY_ID="${CLOUDFLARE_R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="auto"
          r2_endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          object_key="_permission-test/github-actions-${GITHUB_RUN_ID}.txt"
          printf 'net-relay r2 permission test: %s\n' "${GITHUB_RUN_ID}" > r2-permission-test.txt

          aws --endpoint-url "${r2_endpoint}" s3 cp r2-permission-test.txt "s3://${CLOUDFLARE_R2_BUCKET}/${object_key}"
          aws --endpoint-url "${r2_endpoint}" s3 cp "s3://${CLOUDFLARE_R2_BUCKET}/${object_key}" r2-permission-test.downloaded.txt
          cmp r2-permission-test.txt r2-permission-test.downloaded.txt
          aws --endpoint-url "${r2_endpoint}" s3 rm "s3://${CLOUDFLARE_R2_BUCKET}/${object_key}"

      - name: Check OVA scripts
        run: bash tests/ova-scripts-check.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils qemu-system-x86 libguestfs-tools tar

      - name: Install Trivy
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          printf '%s  trivy.tar.gz\n' "${TRIVY_CHECKSUM}" | sha256sum -c
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Build official NetBird relay binaries
        run: |
          mkdir -p dist release
          TARGET_OS=linux TARGET_ARCH=amd64 NETBIRD_RELAY_REF="${NETBIRD_RELAY_REF}" bash relay/build-relay.sh
          TARGET_OS=linux TARGET_ARCH=arm64 NETBIRD_RELAY_REF="${NETBIRD_RELAY_REF}" bash relay/build-relay.sh
          TARGET_OS=linux TARGET_ARCH=amd64 NETBIRD_RELAY_REF="${NETBIRD_RELAY_REF}" bash relay/package-relay.sh
          TARGET_OS=linux TARGET_ARCH=arm64 NETBIRD_RELAY_REF="${NETBIRD_RELAY_REF}" bash relay/package-relay.sh

      - name: Scan relay source with govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd .build/netbird && govulncheck ./relay)

      - name: Generate release metadata
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
          RELEASE_CHANNEL_INPUT: ${{ github.event.inputs.release_channel || 'stable' }}
        run: |
          release_channel="${RELEASE_CHANNEL_INPUT:-stable}"
          case "${release_channel}" in
            stable|test) ;;
            *) echo "::error::release_channel must be stable or test"; exit 1 ;;
          esac

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
            case "${release_tag}" in
              v0.*) release_channel="test" ;;
              v1.*) release_channel="stable" ;;
              *) echo "::error::Tag releases must use v0.* for test or v1.* for stable"; exit 1 ;;
            esac
          elif [ -n "${RELEASE_TAG_INPUT}" ]; then
            release_tag="${RELEASE_TAG_INPUT}"
            case "${release_tag}" in
              v0.*) release_channel="test" ;;
              v1.*) release_channel="stable" ;;
              *) echo "::error::Release tag must use v0.* for test or v1.* for stable"; exit 1 ;;
            esac
          else
            git fetch --tags --force
            if [ "${release_channel}" = "test" ]; then
              tag_prefix="v0.1"
            else
              tag_prefix="v1.0"
            fi
            latest_patch="$(git tag -l "${tag_prefix}.*" | sed -n "s/^${tag_prefix//./\\.}\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -1)"
            if [ -z "${latest_patch}" ]; then
              release_tag="${tag_prefix}.0"
            else
              release_tag="${tag_prefix}.$((latest_patch + 1))"
            fi
          fi

          if [ "${release_channel}" = "test" ] && ! printf '%s' "${release_tag}" | grep -Eq '^v0\.[0-9]+\.[0-9]+$'; then
            echo "::error::Test releases must use v0.* semantic tags, for example v0.1.0"
            exit 1
          fi
          if [ "${release_channel}" = "stable" ] && ! printf '%s' "${release_tag}" | grep -Eq '^v1\.[0-9]+\.[0-9]+$'; then
            echo "::error::Stable releases must use v1.* semantic tags, for example v1.0.0"
            exit 1
          fi

          prerelease="false"
          [ "${release_channel}" = "test" ] && prerelease="true"

          root_password="Net@rels2026"
          ssh_port="$(python3 -c "import secrets; print(secrets.randbelow(45536) + 20000)")"

          {
            echo "release_tag=${release_tag}"
            echo "release_channel=${release_channel}"
            echo "prerelease=${prerelease}"
            echo "root_password=${root_password}"
            echo "ssh_port=${ssh_port}"
            echo "update_note=$(git log -1 --pretty=%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare installer payload
        run: |
          mkdir -p release
          mkdir -p ova-build/netbird-relay-installer ova-build/relay-package
          cp -a relay setup-relay.sh install.sh main.sh README.md .gitignore .gitattributes ova-build/netbird-relay-installer/
          tar -xzf "release/${RELAY_AMD64_PACKAGE}" -C ova-build/relay-package
          cp main.sh release/main.sh
          cp install.sh release/install.sh

      - name: Inject R2 release base
        run: |
          if [ -z "${R2_RELEASE_BASE}" ]; then
            echo "R2_RELEASE_BASE is not configured; release scripts will fall back to GitHub."
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          r2_base = os.environ["R2_RELEASE_BASE"].rstrip("/")
          for name in (
              "release/main.sh",
              "release/install.sh",
              "ova-build/netbird-relay-installer/main.sh",
              "ova-build/netbird-relay-installer/install.sh",
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").replace("__R2_RELEASE_BASE__", r2_base), encoding="utf-8")
          PY

      - name: Download Alpine cloud image
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          export LIBGUESTFS_BACKEND=direct
          curl -fsSL "$ALPINE_IMAGE_URL" -o ova-build/alpine.qcow2
          qemu-img create -f qcow2 ova-build/net-relay-alpine.qcow2 "${IMAGE_SIZE_MIB}M"
          sudo guestfish --rw -a ova-build/alpine.qcow2 -a ova-build/net-relay-alpine.qcow2 <<'EOF'
          run
          part-init /dev/sdb mbr
          part-add /dev/sdb p 2048 -2048
          part-set-bootable /dev/sdb 1 true
          copy-device-to-device /dev/sda /dev/sdb1
          resize2fs /dev/sdb1
          EOF

      - name: Fetch Alpine OVA runtime packages
        run: |
          mkdir -p ova-build/apks
          docker run --rm \
            -v "$PWD/ova-build/apks:/apks" \
            alpine:3.23 \
            sh -ec "apk update && cd /apks && apk fetch --recursive ${OVA_APK_PACKAGES}"

      - name: Customize Alpine OVA image
        env:
          LIBGUESTFS_BACKEND: direct
          ROOT_PASSWORD: ${{ steps.meta.outputs.root_password }}
          SSH_PORT: ${{ steps.meta.outputs.ssh_port }}
        run: |
          set +e
          sudo -E virt-customize --no-network --format qcow2 -a ova-build/net-relay-alpine.qcow2 \
            --root-password "password:${ROOT_PASSWORD}" \
            --mkdir /usr/local/bin \
            --mkdir /usr/local/sbin \
            --mkdir /etc/init.d \
            --mkdir /etc/ssh \
            --mkdir /etc/profile.d \
            --mkdir /etc/modules-load.d \
            --mkdir /etc/sysctl.d \
            --copy-in ova-build/apks:/tmp \
            --copy-in ova-build/relay-package/netbird-relay/bin/netbird-relay:/usr/local/bin \
            --copy-in ova-build/relay-package/netbird-relay/services/netbird-relay.openrc:/etc/init.d \
            --copy-in ova-build/netbird-relay-installer:/opt \
            --copy-in ova/files/rels:/usr/local/sbin \
            --copy-in ova/files/net-relay-firstboot:/usr/local/sbin \
            --copy-in ova/files/setup-root-resize:/usr/local/sbin \
            --copy-in ova/files/setup-network-check:/usr/local/sbin \
            --copy-in ova/files/setup-zram:/usr/local/sbin \
            --copy-in ova/files/setup-kernel-tuning:/usr/local/sbin \
            --copy-in ova/files/setup-bootloader:/usr/local/sbin \
            --copy-in ova/files/sshd_config:/etc/ssh \
            --copy-in ova/files/00-net-relay-locale.sh:/etc/profile.d \
            --copy-in ova/files/virtio-modules.conf:/etc/modules-load.d \
            --copy-in ova/files/99-net-relay-login.cfg:/etc/cloud/cloud.cfg.d \
            --copy-in ova/files/99-net-relay-sysctl.conf:/etc/sysctl.d \
            --copy-in ova/files/root-profile:/root \
            --run-command "apk add --no-network --allow-untrusted --upgrade /tmp/apks/*.apk && rm -rf /tmp/apks" \
            --run-command "ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime && printf '%s\n' 'Asia/Shanghai' > /etc/timezone" \
            --run-command "chmod 0644 /etc/profile.d/00-net-relay-locale.sh" \
            --run-command "chage -d 0 root || passwd -e root || true" \
            --run-command "sed -i 's/__SSH_PORT__/${SSH_PORT}/' /etc/ssh/sshd_config" \
            --run-command "sed -i 's/__SSH_PORT__/${SSH_PORT}/' /usr/local/sbin/net-relay-firstboot" \
            --run-command "chmod +x /usr/local/bin/netbird-relay /usr/local/sbin/rels /usr/local/sbin/net-relay-firstboot /usr/local/sbin/setup-root-resize /usr/local/sbin/setup-network-check /usr/local/sbin/setup-zram /usr/local/sbin/setup-kernel-tuning /usr/local/sbin/setup-bootloader /opt/netbird-relay-installer/setup-relay.sh" \
            --run-command "ln -sf /usr/local/sbin/rels /usr/local/bin/rels" \
            --run-command "/usr/local/sbin/setup-bootloader /dev/sda1 /dev/sda" \
            --run-command "setup-cloud-init" \
            --run-command "rc-update add qemu-guest-agent default || true" \
            --run-command "chmod +x /etc/init.d/netbird-relay.openrc && mv /etc/init.d/netbird-relay.openrc /etc/init.d/netbird-relay" \
            --run-command "cat /root/root-profile >> /root/.profile && rm -f /root/root-profile" 2>&1 | tee ova-build/virt-customize.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            {
              echo "virt-customize failed with exit code ${status}"
              tail -n 120 ova-build/virt-customize.log
            } | python3 -c 'import sys; print("::error::" + sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit "$status"
          fi

      - name: Package OVA release images
        run: |
          qemu-img convert -p -O vmdk -o subformat=streamOptimized,adapter_type=lsilogic ova-build/net-relay-alpine.qcow2 release/net-relay-alpine-x86_64.vmdk
          vmdk_size="$(stat -c%s release/net-relay-alpine-x86_64.vmdk)"
          write_ovf() {
            local ovf_path="$1"
            local network_connection="$2"
            cat > "$ovf_path" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Envelope xmlns="http://schemas.dmtf.org/ovf/envelope/1" xmlns:ovf="http://schemas.dmtf.org/ovf/envelope/1" xmlns:rasd="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/CIM_ResourceAllocationSettingData" xmlns:vmw="http://www.vmware.com/schema/ovf">
            <References>
              <File ovf:id="file1" ovf:href="net-relay-alpine-x86_64.vmdk" ovf:size="${vmdk_size}"/>
            </References>
            <DiskSection>
              <Info>Virtual disk information</Info>
              <Disk ovf:diskId="disk1" ovf:fileRef="file1" ovf:capacity="${IMAGE_SIZE_MIB}" ovf:capacityAllocationUnits="byte * 2^20" ovf:format="http://www.vmware.com/interfaces/specifications/vmdk.html#streamOptimized"/>
            </DiskSection>
            <NetworkSection>
              <Info>Logical networks used in the package</Info>
              <Network ovf:name="VM Network"><Description>VM Network</Description></Network>
            </NetworkSection>
            <VirtualSystem ovf:id="net-relay-alpine">
              <Info>NetBird Relay Alpine OVA</Info>
              <Name>net-relay-alpine</Name>
              <OperatingSystemSection ovf:id="94" vmw:osType="otherlinux64Guest"><Info>Alpine Linux</Info></OperatingSystemSection>
              <VirtualHardwareSection>
                <Info>Virtual hardware requirements</Info>
                <Item><rasd:Description>1 virtual CPU</rasd:Description><rasd:ElementName>1 virtual CPU</rasd:ElementName><rasd:InstanceID>1</rasd:InstanceID><rasd:ResourceType>3</rasd:ResourceType><rasd:VirtualQuantity>1</rasd:VirtualQuantity></Item>
                <Item><rasd:AllocationUnits>byte * 2^20</rasd:AllocationUnits><rasd:Description>1024MB memory</rasd:Description><rasd:ElementName>1024MB memory</rasd:ElementName><rasd:InstanceID>2</rasd:InstanceID><rasd:ResourceType>4</rasd:ResourceType><rasd:VirtualQuantity>1024</rasd:VirtualQuantity></Item>
                <Item><rasd:Description>SCSI Controller</rasd:Description><rasd:ElementName>SCSI Controller 0</rasd:ElementName><rasd:InstanceID>3</rasd:InstanceID><rasd:ResourceSubType>lsilogic</rasd:ResourceSubType><rasd:ResourceType>6</rasd:ResourceType></Item>
                <Item><rasd:AddressOnParent>0</rasd:AddressOnParent>${network_connection}<rasd:Description>E1000 network adapter</rasd:Description><rasd:ElementName>Ethernet 1</rasd:ElementName><rasd:InstanceID>4</rasd:InstanceID><rasd:ResourceSubType>E1000</rasd:ResourceSubType><rasd:ResourceType>10</rasd:ResourceType></Item>
                <Item><rasd:Description>Disk</rasd:Description><rasd:ElementName>Disk 1</rasd:ElementName><rasd:HostResource>ovf:/disk/disk1</rasd:HostResource><rasd:InstanceID>5</rasd:InstanceID><rasd:Parent>3</rasd:Parent><rasd:ResourceType>17</rasd:ResourceType></Item>
              </VirtualHardwareSection>
            </VirtualSystem>
          </Envelope>
          EOF
          }
          write_ovf release/net-relay-alpine-x86_64.ovf '<rasd:Connection>VM Network</rasd:Connection>'
          tar -C release -cf "release/${OVA_NAME}" net-relay-alpine-x86_64.ovf net-relay-alpine-x86_64.vmdk
          qemu-img convert -p -O raw ova-build/net-relay-alpine.qcow2 "release/${RAW_NAME}"
          qemu-img convert -p -O qcow2 ova-build/net-relay-alpine.qcow2 "release/${QCOW2_NAME}"

      - name: Verify RAW BIOS bootability
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          qemu-img info "release/${RAW_NAME}"
          sudo -E virt-df --csv -a "release/${RAW_NAME}" | tee ova-build/raw-df.txt
          root_available_mib="$(awk -F, '$2 == "/dev/sda1" {print int($5 / 1024)}' ova-build/raw-df.txt)"
          if [ -z "${root_available_mib}" ] || [ "${root_available_mib}" -lt "${MIN_ROOT_FREE_MIB}" ]; then
            cat ova-build/raw-df.txt
            echo "::error::RAW root partition must keep at least ${MIN_ROOT_FREE_MIB} MiB free before cloud first boot."
            exit 1
          fi
          sudo sfdisk --verify "release/${RAW_NAME}"
          if ! sudo fdisk -l "release/${RAW_NAME}" | grep -Eq '^[^[:space:]]+[0-9]+[[:space:]]+\*'; then
            sudo fdisk -l "release/${RAW_NAME}"
            echo "::error::RAW image is missing a bootable MBR partition."
            exit 1
          fi
          qemu-system-x86_64 \
            -machine pc \
            -m 512 \
            -drive file=release/${RAW_NAME},format=raw,if=virtio \
            -serial file:ova-build/raw-boot.log \
            -display none \
            -no-reboot \
            -snapshot \
            -pidfile ova-build/qemu.pid &
          qemu_pid="$!"
          for _ in $(seq 1 60); do
            if grep -Eq "Welcome to Alpine|login:" ova-build/raw-boot.log 2>/dev/null; then
              kill "$qemu_pid" || true
              wait "$qemu_pid" || true
              exit 0
            fi
            if grep -Eq "No bootable device|Boot failed|Error: / needs at least" ova-build/raw-boot.log 2>/dev/null; then
              break
            fi
            sleep 2
          done
          kill "$qemu_pid" || true
          wait "$qemu_pid" || true
          tail -n 120 ova-build/raw-boot.log || true
          exit 1

      - name: Package RAW tar.xz image
        run: |
          IMAGE_ASSETS=(
            "${RAW_NAME}.tar.xz"
            "$QCOW2_NAME"
          )

          tar -C release -cJf "release/${RAW_NAME}.tar.xz" "$RAW_NAME"
          rm -f "release/${RAW_NAME}"

          printf '%s\n' "${IMAGE_ASSETS[@]}" > release/IMAGE_ASSETS.txt

      - name: Scan release workspace with Trivy
        run: |
          mkdir -p ova-build/trivy-workspace
          cp -a .github ova relay worker install.sh main.sh setup-relay.sh README.md LICENSE ova-build/trivy-workspace/
          cp -a release ova-build/trivy-workspace/
          set +e
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output release/trivy-fs.json \
            ova-build/trivy-workspace
          status="$?"
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("release/trivy-fs.json")
          data = json.loads(report.read_text(encoding="utf-8"))
          for result in data.get("Results", []):
              target = result.get("Target", "")
              for vuln in result.get("Vulnerabilities", []) or []:
                  print(f"::error file={target}::{vuln.get('Severity')} {vuln.get('VulnerabilityID')} {vuln.get('PkgName')} {vuln.get('InstalledVersion')} -> {vuln.get('FixedVersion')}")
              for secret in result.get("Secrets", []) or []:
                  print(f"::error file={target},line={secret.get('StartLine', 1)}::SECRET {secret.get('RuleID')} {secret.get('Title')}")
              for misconf in result.get("Misconfigurations", []) or []:
                  print(f"::error file={target}::{misconf.get('Severity')} {misconf.get('ID')} {misconf.get('Title')}")
          PY
            exit "$status"
          fi

      - name: Upload release workspace Trivy report
        if: ${{ failure() && hashFiles('release/trivy-fs.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-failure-report
          path: release/trivy-fs.json

      - name: Scan Alpine rootfs with Trivy
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          mkdir -p ova-build/rootfs
          cleanup_rootfs() {
            rm -rf ova-build/rootfs
          }
          trap cleanup_rootfs EXIT
          sudo virt-copy-out -a ova-build/net-relay-alpine.qcow2 / ova-build/rootfs
          sudo chown -R "$(id -u):$(id -g)" ova-build/rootfs
          trivy rootfs \
            --scanners vuln \
            --pkg-types os \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            --format json \
            --output release/trivy-rootfs.json \
            ova-build/rootfs
          if python3 -c 'import json,sys; data=json.load(open("release/trivy-rootfs.json")); sys.exit(0 if any(r.get("Vulnerabilities") for r in data.get("Results", [])) else 1)'; then
            trivy rootfs \
              --scanners vuln \
              --pkg-types os \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 0 \
              --format table \
              ova-build/rootfs
            exit 1
          fi

      - name: Generate release SBOM
        run: |
          trivy filesystem \
            --format cyclonedx \
            --output release/net-relay-sbom.cdx.json \
            release
          trivy sbom \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            release/net-relay-sbom.cdx.json
          mapfile -t IMAGE_ASSETS < release/IMAGE_ASSETS.txt
          (cd release && sha256sum "$OVA_NAME" "${IMAGE_ASSETS[@]}" "$RELAY_AMD64_PACKAGE" "$RELAY_ARM64_PACKAGE" main.sh install.sh trivy-rootfs.json trivy-fs.json net-relay-sbom.cdx.json > SHA256SUMS)

      - name: Write release notes
        env:
          R2_RELEASE_BASE: ${{ env.R2_RELEASE_BASE }}
        run: |
          if [ -n "${R2_RELEASE_BASE}" ]; then
            quick_install_url="${R2_RELEASE_BASE%/}/main.sh"
          else
            quick_install_url="https://github.com/kos991/net_relay/releases/latest/download/main.sh"
          fi
          cat > release/RELEASE_NOTES.md <<EOF
          # NetBird Relay ${{ steps.meta.outputs.release_tag }}

          This release provides official NetBird Relay binaries built from the upstream NetBird source, plus ready-to-import OVA, QCOW2, and RAW images.

          ## Quick install
          \`\`\`bash
          curl -sSL ${quick_install_url} | sh
          \`\`\`

          ## Release channel

          - Channel: ${{ steps.meta.outputs.release_channel }}
          - Test releases use v0.* tags; stable releases use v1.* tags.
          - NetBird Relay upstream ref: ${NETBIRD_RELAY_REF}

          ## Published assets

          - ${RELAY_AMD64_PACKAGE}: Linux amd64 official relay binary package.
          - ${RELAY_ARM64_PACKAGE}: Linux arm64 official relay binary package.
          - ${OVA_NAME}: OVA with OVF network Connection for importers that require it.
          - ${QCOW2_NAME}: QCOW2 disk image for Aliyun and cloud custom image import.
          - ${RAW_NAME}.tar.xz: RAW disk image packaged as tar.xz for bin456789/reinstall and reinstall workflows.
          - main.sh: secure bootstrap script served by https://rels.jinfei.org.
          - install.sh: one-click installer for Debian, Ubuntu, Rocky, Alma, and Alpine.
          - SHA256SUMS: SHA256 checksums for all published artifacts.
          - trivy-rootfs.json: Alpine rootfs vulnerability scan report.

          ## OVA access

          - User: root
          - Initial password: ${{ steps.meta.outputs.root_password }}
          - SSH port: ${{ steps.meta.outputs.ssh_port }}
          - Login command: \`ssh -p ${{ steps.meta.outputs.ssh_port }} root@<OVA_IP>\`
          - First login will force a root password change before initialization continues.

          ## OVA initialization

          - Enables ZRAM swap and daily ZRAM compact maintenance.
          - Applies the conservative NetBird Relay kernel tuning profile.
          - Expands the root partition when the virtual disk has been resized.
          - Runs DHCP and network preflight checks on first boot.
          - Installs cloud-init, qemu-guest-agent, VirtIO support, xfsprogs, and btrfs-progs.
          - Run \`rels\` and choose option 7 to view ZRAM and kernel optimization status.

          ## Security and verification

          - Relay service runs as the dedicated netbird-relay user in binary mode.
          - Release build runs govulncheck and Trivy High/Critical gates before publishing.
          - Verify downloaded artifacts with SHA256SUMS before production use.
          - Update: ${{ steps.meta.outputs.update_note }}
          EOF

      - name: Sync release assets to Cloudflare R2
        run: |
          if [ -z "${R2_RELEASE_BASE}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_R2_ACCESS_KEY_ID}" ] || [ -z "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}" ] || [ -z "${CLOUDFLARE_R2_BUCKET}" ]; then
            echo "Cloudflare R2 is not fully configured; skipping R2 asset sync."
            exit 0
          fi

          python3 -m pip install --user --upgrade awscli
          export PATH="${HOME}/.local/bin:${PATH}"
          export AWS_ACCESS_KEY_ID="${CLOUDFLARE_R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION="auto"
          r2_endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          tag="${{ steps.meta.outputs.release_tag }}"

          aws --endpoint-url "${r2_endpoint}" s3 sync release "s3://${CLOUDFLARE_R2_BUCKET}/latest" --delete
          aws --endpoint-url "${r2_endpoint}" s3 sync release "s3://${CLOUDFLARE_R2_BUCKET}/releases/${tag}" --delete

      - name: Publish release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.release_tag }}"
          release_args=()
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            release_args+=(--prerelease)
          fi
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            git tag "$tag"
            git push origin "$tag"
          fi
          mapfile -t IMAGE_ASSETS < release/IMAGE_ASSETS.txt
          image_release_args=()
          for image_asset in "${IMAGE_ASSETS[@]}"; do
            image_release_args+=("release/${image_asset}")
          done
          gh release create "$tag" \
            --title "$tag" \
            "${release_args[@]}" \
            --notes-file release/RELEASE_NOTES.md \
            "release/${OVA_NAME}" \
            "${image_release_args[@]}" \
            "release/${RELAY_AMD64_PACKAGE}" \
            "release/${RELAY_ARM64_PACKAGE}" \
            "release/main.sh" \
            "release/install.sh" \
            release/trivy-rootfs.json \
            release/SHA256SUMS

      - name: Keep only latest release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep_tag="${{ steps.meta.outputs.release_tag }}"
          channel="${{ steps.meta.outputs.release_channel }}"
          if [ "${channel}" = "test" ]; then
            tag_prefix="v0."
          else
            tag_prefix="v1."
          fi
          gh release list --limit 100 --json tagName \
            --jq '.[].tagName' \
            | while IFS= read -r old_tag; do
                [ -n "$old_tag" ] || continue
                [ "$old_tag" != "$keep_tag" ] || continue
                case "$old_tag" in
                  "${tag_prefix}"*.*) ;;
                  *) continue ;;
                esac
                gh release delete "$old_tag" --yes --cleanup-tag
              done
