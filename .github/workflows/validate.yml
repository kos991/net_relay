name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.71.0"
      TRIVY_CHECKSUM: "30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: false

      - name: Install Trivy
        run: |
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          printf '%s  trivy.tar.gz\n' "${TRIVY_CHECKSUM}" | sha256sum -c
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Validate GitHub token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth status
          gh api "repos/${GITHUB_REPOSITORY}" --jq .full_name

      - name: Check workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts "parsed #{f}" }'

      - name: Check OVA and installer scripts
        run: bash tests/ova-scripts-check.sh

      - name: Scan repository with Trivy
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            .

      - name: Scan relay source with govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          BUILD_DIR="${PWD}/.build/netbird" NETBIRD_RELAY_REF=main bash relay/build-relay.sh
          (cd .build/netbird && govulncheck ./relay)

      - name: Check whitespace
        run: git diff --check
